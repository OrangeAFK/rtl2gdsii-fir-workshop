# On Windows, run these commands from WSL bash (not PowerShell).
services:
  pd-workshop:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENLANE_TAG: "2.3.10"
    image: ghcr.io/orangeafk/rtl2gdsii-fir-workshop:2026.1
    user: "0:0"
    working_dir: /workshop
    volumes:
      - ./design:/workshop/design
      - ./config:/workshop/config
      - ./reports:/workshop/reports
      - ./scripts:/workshop/scripts
      - ./runs:/workshop/runs
    environment:
      - PDK=sky130A
      - STD_CELL_LIBRARY=sky130_fd_sc_hd
      - DESIGN=fir_naive
      - DISPLAY=${DISPLAY:-:0}
    stdin_open: true
    tty: true
    command: ["bash"]
